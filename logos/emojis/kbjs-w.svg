<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="wbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2b23"/><stop offset="100%" stop-color="#191d2b"/>
    </linearGradient>
    <linearGradient id="wgrn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6ee7b7"/><stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#wbg)"/>
  <rect x="4" y="4" width="120" height="120" rx="25" fill="none" stroke="url(#wgrn)" stroke-width="3" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.25;0.6" dur="2s" repeatCount="indefinite"/>
  </rect>
  <g>
