<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="lbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2e1420"/><stop offset="100%" stop-color="#191d2b"/>
    </linearGradient>
    <linearGradient id="lpnk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff8fab"/><stop offset="100%" stop-color="#ff5c8a"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#lbg)"/>
  <rect x="4" y="4" width="120" height="120" rx="25" fill="none" stroke="url(#lpnk)" stroke-width="3" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.25;0.6" dur="2.6s" repeatCount="indefinite"/>
  </rect>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 3;0 0" dur="2.2s" repeatCount="indefinite"/>
    <text x="64" y="88" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="900" font-size="62" fill="url(#lpnk)">L</text>
  </g>
</svg>
