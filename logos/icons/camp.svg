<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bg-camp" x1="0" y1="0" x2="100" y2="100">
      <stop offset="0%" stop-color="#1e1e3a"/>
      <stop offset="100%" stop-color="#15152a"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="20" fill="url(#bg-camp)"/>
  <!-- Tent body -->
  <path d="M22 74 L50 18 L78 74" fill="none" stroke="white" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- Tent opening -->
  <path d="M42 74 L50 55 L58 74" fill="none" stroke="white" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Tent pole top -->
  <circle cx="50" cy="18" r="3" fill="none" stroke="white" stroke-width="2.5"/>
  <!-- Ground line -->
  <line x1="18" y1="74" x2="82" y2="74" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <!-- Campfire logs -->
  <line x1="50" y1="64" x2="42" y2="70" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="64" x2="58" y2="70" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Campfire flames -->
  <path d="M47 64 Q50 52 53 64" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M45 64 Q50 56 55 64" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <!-- Stars -->
  <circle cx="30" cy="30" r="1.5" fill="white"/>
  <circle cx="68" cy="26" r="1.5" fill="white"/>
  <circle cx="72" cy="40" r="1" fill="white"/>
  <circle cx="26" cy="38" r="1" fill="white"/>
</svg>