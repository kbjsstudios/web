<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="100" y2="100">
      <stop offset="0%" stop-color="#1e1e3a"/>
      <stop offset="100%" stop-color="#15152a"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="20" fill="url(#bg1)"/>
  <!-- Sword 1 (diagonal left-bottom to right-top) -->
  <line x1="30" y1="68" x2="58" y2="28" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="42" y1="38" x2="70" y2="68" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="30" y1="68" x2="20" y2="75" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <line x1="70" y1="68" x2="80" y2="75" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <!-- Sword 2 (diagonal right-bottom to left-top) -->
  <line x1="70" y1="68" x2="42" y2="28" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="58" y1="38" x2="30" y2="68" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Guards -->
  <line x1="34" y1="60" x2="22" y2="66" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <line x1="66" y1="60" x2="78" y2="66" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <!-- Handles -->
  <line x1="30" y1="68" x2="28" y2="76" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="70" y1="68" x2="72" y2="76" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
</svg>
