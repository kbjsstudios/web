<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bg8" x1="0" y1="0" x2="100" y2="100">
      <stop offset="0%" stop-color="#1e1e3a"/>
      <stop offset="100%" stop-color="#15152a"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="20" fill="url(#bg8)"/>
  <!-- Globe circle -->
  <circle cx="50" cy="48" r="28" fill="none" stroke="white" stroke-width="3.5"/>
  <!-- Horizontal latitude lines -->
  <ellipse cx="50" cy="38" rx="22" ry="6" fill="none" stroke="white" stroke-width="2.5"/>
  <ellipse cx="50" cy="48" rx="28" ry="6" fill="none" stroke="white" stroke-width="2.5"/>
  <ellipse cx="50" cy="58" rx="22" ry="6" fill="none" stroke="white" stroke-width="2.5"/>
  <!-- Vertical longitude line -->
  <line x1="50" y1="20" x2="50" y2="76" stroke="white" stroke-width="2.5"/>
  <!-- Base/stand -->
  <line x1="30" y1="80" x2="70" y2="80" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="40" y1="80" x2="40" y2="86" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <line x1="60" y1="80" x2="60" y2="86" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <line x1="36" y1="86" x2="64" y2="86" stroke="white" stroke-width="3" stroke-linecap="round"/>
</svg>
